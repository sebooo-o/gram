<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gram | Coffee Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" id="home">
      <div class="container">
        <div class="brand" id="brand-name"></div>
        <nav>
          <ul class="nav-list" id="nav-list"></ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="hero-kicker" id="hero-kicker"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-subtitle" id="hero-subtitle"></p>
          <a id="hero-cta" class="btn" href="#"></a>
        </div>
      </section>

      <section class="section" id="about">
        <div class="container">
          <h2 id="about-title"></h2>
          <p id="about-description"></p>
        </div>
      </section>

      <section class="section" id="menu">
        <div class="container">
          <h2 id="menu-title"></h2>
          <div class="card-grid" id="menu-items"></div>
        </div>
      </section>

      <section class="section" id="hours">
        <div class="container">
          <h2 id="hours-title"></h2>
          <ul class="list" id="hours-list"></ul>
        </div>
      </section>

      <section class="section" id="contact">
        <div class="container">
          <h2 id="contact-title"></h2>
          <address id="contact-address"></address>
          <p><a id="contact-phone" href="#"></a></p>
          <p><a id="contact-email" href="#"></a></p>
          <ul class="social-list" id="social-list"></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p id="footer-note"></p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
